x-health: &health
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
    ]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 15s

x-data: &data
  NODE_ENV: ${NODE_ENV}
  JWT_SECRET: ${JWT_SECRET}
  CORS_ORIGIN: ${CORS_ORIGIN}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL}
  PUBLIC_API_URL: ${PUBLIC_API_URL}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  IDENTITY_URL: ${IDENTITY_URL}
  CATALOG_URL: ${CATALOG_URL}
  CART_URL: ${CART_URL}
  ORDERS_URL: ${ORDERS_URL}
  ACCOUNT_URL: ${ACCOUNT_URL}
  SELLERS_URL: ${SELLERS_URL}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    profiles: ["apps"]
    build:
      context: .
      args:
        APP: api-gateway
    image: kernoon/api-gateway:${IMAGE_TAG}
    ports:
      - "3000:3000"
    environment:
      <<: *data
      PORT: "3000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
      cart:
        condition: service_healthy
      orders:
        condition: service_healthy
      account:
        condition: service_healthy
      sellers:
        condition: service_healthy

  identity:
    profiles: ["apps"]
    build:
      context: .
      args:
        APP: identity
    image: kernoon/identity:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/identity
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *health

  catalog:
    profiles: ["apps"]
    build:
      context: .
      args:
        APP: catalog
    image: kernoon/catalog:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *health

  cart:
    profiles: ["apps"]
    build:
      context: .
      args:
        APP: cart
    image: kernoon/cart:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3003"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *health

  orders:
    profiles: ["apps"]
    build:
      context: .
      args:
        APP: orders
    image: kernoon/orders:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3004"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orders
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_healthy
      account:
        condition: service_healthy
    healthcheck: *health

  account:
    profiles: ["apps"]
    build:
      context: .
      args:
        APP: account
    image: kernoon/account:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3005"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/account
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *health

  sellers:
    profiles: ["apps"]
    build:
      context: .
      args:
        APP: sellers
    image: kernoon/sellers:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3006"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sellers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *health

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

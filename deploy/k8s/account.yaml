apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
  namespace: kernoon
  labels:
    app: account
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      containers:
        - name: account
          image: kernoon/account:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3005
          env:
            - name: PORT
              value: "3005"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: account
  namespace: kernoon
spec:
  selector:
    app: account
  ports:
    - name: http
      port: 3005
      targetPort: http

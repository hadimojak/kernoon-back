apiVersion: apps/v1
kind: Deployment
metadata:
  name: sellers
  namespace: kernoon
  labels:
    app: sellers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sellers
  template:
    metadata:
      labels:
        app: sellers
    spec:
      containers:
        - name: sellers
          image: kernoon/sellers:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3006
          env:
            - name: PORT
              value: "3006"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sellers
  namespace: kernoon
spec:
  selector:
    app: sellers
  ports:
    - name: http
      port: 3006
      targetPort: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: kernoon
  labels:
    app: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: kernoon/orders:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          envFrom:
            - configMapRef:
                name: kernoon-config
          env:
            - name: PORT
              value: "3004"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: kernoon
spec:
  selector:
    app: orders
  ports:
    - name: http
      port: 3004
      targetPort: http

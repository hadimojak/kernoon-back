services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kernoon
      POSTGRES_PASSWORD: kernoon
      POSTGRES_DB: kernoon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/01-databases.sql
    networks:
      - kernoon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kernoon -d kernoon"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "kernoon"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kernoon
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kernoon", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: kernoon
      RABBITMQ_DEFAULT_PASS: kernoon
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - kernoon
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  api-gateway:
    image: kernoon/api-gateway:local
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      JWT_SECRET: dev-only-change-me
      CORS_ORIGIN: http://localhost:5000
      IDENTITY_URL: http://identity:3001
      CATALOG_URL: http://catalog:3002
      CART_URL: http://cart:3003
      ORDERS_URL: http://orders:3004
      ACCOUNT_URL: http://account:3005
      SELLERS_URL: http://sellers:3006
      REDIS_URL: redis://:kernoon@redis:6379
      RABBITMQ_URL: amqp://kernoon:kernoon@rabbitmq:5672
    networks:
      - kernoon
    deploy:
      replicas: 1

  identity:
    image: kernoon/identity:local
    environment:
      PORT: "3001"
      JWT_SECRET: dev-only-change-me
      DATABASE_URL: postgresql://kernoon:kernoon@postgres:5432/identity
      REDIS_URL: redis://:kernoon@redis:6379
      RABBITMQ_URL: amqp://kernoon:kernoon@rabbitmq:5672
    networks:
      - kernoon
    deploy:
      replicas: 1

  catalog:
    image: kernoon/catalog:local
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://kernoon:kernoon@postgres:5432/catalog
      REDIS_URL: redis://:kernoon@redis:6379
      RABBITMQ_URL: amqp://kernoon:kernoon@rabbitmq:5672
    networks:
      - kernoon
    deploy:
      replicas: 1

  cart:
    image: kernoon/cart:local
    environment:
      PORT: "3003"
      DATABASE_URL: postgresql://kernoon:kernoon@postgres:5432/cart
      REDIS_URL: redis://:kernoon@redis:6379
      RABBITMQ_URL: amqp://kernoon:kernoon@rabbitmq:5672
    networks:
      - kernoon
    deploy:
      replicas: 1

  orders:
    image: kernoon/orders:local
    environment:
      PORT: "3004"
      DATABASE_URL: postgresql://kernoon:kernoon@postgres:5432/orders
      CATALOG_URL: http://catalog:3002
      ACCOUNT_URL: http://account:3005
      REDIS_URL: redis://:kernoon@redis:6379
      RABBITMQ_URL: amqp://kernoon:kernoon@rabbitmq:5672
    networks:
      - kernoon
    deploy:
      replicas: 1

  account:
    image: kernoon/account:local
    environment:
      PORT: "3005"
      DATABASE_URL: postgresql://kernoon:kernoon@postgres:5432/account
      REDIS_URL: redis://:kernoon@redis:6379
      RABBITMQ_URL: amqp://kernoon:kernoon@rabbitmq:5672
    networks:
      - kernoon
    deploy:
      replicas: 1

  sellers:
    image: kernoon/sellers:local
    environment:
      PORT: "3006"
      DATABASE_URL: postgresql://kernoon:kernoon@postgres:5432/sellers
      REDIS_URL: redis://:kernoon@redis:6379
      RABBITMQ_URL: amqp://kernoon:kernoon@rabbitmq:5672
    networks:
      - kernoon
    deploy:
      replicas: 1

networks:
  kernoon:
    driver: overlay

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

configs:
  postgres_init:
    file: ../../docker/postgres/init.sql

x-data: &data
  NODE_ENV: ${NODE_ENV}
  JWT_SECRET: ${JWT_SECRET}
  CORS_ORIGIN: ${CORS_ORIGIN}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL}
  PUBLIC_API_URL: ${PUBLIC_API_URL}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  IDENTITY_URL: ${IDENTITY_URL}
  CATALOG_URL: ${CATALOG_URL}
  CART_URL: ${CART_URL}
  ORDERS_URL: ${ORDERS_URL}
  ACCOUNT_URL: ${ACCOUNT_URL}
  SELLERS_URL: ${SELLERS_URL}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/01-databases.sql
    networks:
      - kernoon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kernoon
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - kernoon
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  api-gateway:
    image: kernoon/api-gateway:${IMAGE_TAG}
    ports:
      - "3000:3000"
    environment:
      <<: *data
      PORT: "3000"
    networks:
      - kernoon
    deploy:
      replicas: 1

  identity:
    image: kernoon/identity:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/identity
    networks:
      - kernoon
    deploy:
      replicas: 1

  catalog:
    image: kernoon/catalog:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog
    networks:
      - kernoon
    deploy:
      replicas: 1

  cart:
    image: kernoon/cart:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3003"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cart
    networks:
      - kernoon
    deploy:
      replicas: 1

  orders:
    image: kernoon/orders:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3004"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orders
    networks:
      - kernoon
    deploy:
      replicas: 1

  account:
    image: kernoon/account:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3005"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/account
    networks:
      - kernoon
    deploy:
      replicas: 1

  sellers:
    image: kernoon/sellers:${IMAGE_TAG}
    environment:
      <<: *data
      PORT: "3006"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sellers
    networks:
      - kernoon
    deploy:
      replicas: 1

networks:
  kernoon:
    driver: overlay

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

configs:
  postgres_init:
    file: ../../docker/postgres/init.sql
